name: Database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Install Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Edge Functions
        working-directory: supabase/functions
        run: deno task check

      - name: Apply migrations to fresh Postgres
        run: supabase db start

      - name: Verify deterministic development seed
        shell: bash
        run: |
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          first_checksum="$(psql "$DATABASE_URL" -Atq -f supabase/verify-dev-seed.sql)"
          supabase db reset
          second_checksum="$(psql "$DATABASE_URL" -Atq -f supabase/verify-dev-seed.sql)"
          test -n "$first_checksum"
          test "$first_checksum" = "$second_checksum"
          psql "$DATABASE_URL" -f supabase/clear-dev-seed.sql

      - name: Lint database functions
        run: supabase db lint --local --level warning --fail-on error

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run backend integration and concurrency tests
        run: bash supabase/integration-tests/backend_concurrency.sh
