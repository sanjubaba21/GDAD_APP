name: Windows desktop release gate

on:
  pull_request:
    paths:
      - "desktopApp/**"
      - "app/src/main/java/com/gdad/bags/data/auth/**"
      - "app/src/main/java/com/gdad/bags/data/product/**"
      - "app/src/main/java/com/gdad/bags/data/remote/**"
      - "app/src/main/java/com/gdad/bags/data/report/**"
      - "app/src/main/java/com/gdad/bags/data/sale/**"
      - "app/src/main/java/com/gdad/bags/domain/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build-windows-app.ps1"
      - "run-windows-app.ps1"
      - ".github/workflows/windows-desktop-release.yml"
  push:
    branches: [main]
    paths:
      - "desktopApp/**"
      - "app/src/main/java/com/gdad/bags/data/auth/**"
      - "app/src/main/java/com/gdad/bags/data/product/**"
      - "app/src/main/java/com/gdad/bags/data/remote/**"
      - "app/src/main/java/com/gdad/bags/data/report/**"
      - "app/src/main/java/com/gdad/bags/data/sale/**"
      - "app/src/main/java/com/gdad/bags/domain/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build-windows-app.ps1"
      - "run-windows-app.ps1"
      - ".github/workflows/windows-desktop-release.yml"
  workflow_dispatch:
    inputs:
      production_release:
        description: Build the Windows packages using the protected production environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Run Windows desktop gate
        shell: pwsh
        run: >-
          .\gradlew.bat
          :desktopApp:test
          :desktopApp:verifyDesktopAuthSafety
          :desktopApp:createDistributable
          --no-daemon
          --max-workers=1
          '-Pkotlin.compiler.execution.strategy=in-process'

  production-release:
    if: github.event_name == 'workflow_dispatch' && inputs.production_release
    needs: verify-windows
    runs-on: windows-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Build protected production packages
        shell: pwsh
        env:
          GDAD_DESKTOP_PRODUCTION_RELEASE: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
        run: >-
          .\gradlew.bat
          :desktopApp:clean
          :desktopApp:test
          :desktopApp:verifyDesktopAuthSafety
          :desktopApp:verifyDesktopProductionReady
          :desktopApp:createDistributable
          :desktopApp:packageMsi
          :desktopApp:packageExe
          --no-daemon
          --max-workers=1
          '-Pkotlin.compiler.execution.strategy=in-process'

      - name: Verify protected runtime binding
        shell: pwsh
        env:
          EXPECTED_SUPABASE_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          EXPECTED_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $jar = Get-ChildItem "desktopApp/build/compose/binaries/main/app/GDAD BAGS/app" -Filter "desktopApp-*.jar" | Select-Object -First 1
          if ($null -eq $jar) { throw "Packaged desktop application JAR is missing." }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          try {
            $entry = $zip.GetEntry("gdad-desktop.properties")
            if ($null -eq $entry) { throw "Packaged runtime configuration is missing." }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $content = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $url = [regex]::Match($content, '(?m)^supabase\.url=(.+)$').Groups[1].Value.Trim()
          $key = [regex]::Match($content, '(?m)^supabase\.publishableKey=(.+)$').Groups[1].Value.Trim()
          if ($url -ne $env:EXPECTED_SUPABASE_URL.TrimEnd('/')) { throw "Unexpected production URL binding." }
          if ($key -ne $env:EXPECTED_PUBLISHABLE_KEY) { throw "Unexpected publishable-key binding." }
          if ($key -notmatch '^sb_publishable_[A-Za-z0-9_-]{20,240}$') { throw "Packaged key is not client-safe." }
          if ($content -match 'sb_secret_|service_role|PIN_PEPPER|RATE_LIMIT_PEPPER') { throw "Privileged marker found in runtime configuration." }

      - name: Name and checksum Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-output | Out-Null
          Compress-Archive -Path "desktopApp/build/compose/binaries/main/app/GDAD BAGS/*" -DestinationPath "release-output/GDAD-BAGS-Windows-0.1.0-portable.zip"
          Copy-Item (Get-ChildItem desktopApp/build/compose/binaries/main/msi -Filter *.msi | Select-Object -First 1).FullName "release-output/GDAD-BAGS-Windows-0.1.0.msi"
          Copy-Item (Get-ChildItem desktopApp/build/compose/binaries/main/exe -Filter *.exe | Select-Object -First 1).FullName "release-output/GDAD-BAGS-Windows-0.1.0-setup.exe"
          Get-ChildItem release-output -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload protected Windows artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: GDAD-BAGS-Windows-0.1.0-production
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
